<!DOCTYPE html>
<html>
<head>
    <title>Criar Conta</title>
    <!-- Liga este HTML ao ficheiro de estilo CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- BARRA DE CIMA -->
    <header class="navbar">
        <img src="logo.png" class="logo-img"> <!-- Imagem da logo -->
        <nav class="nav-links">
            <a href="indexisa.html">Início</a>
            <a href="login.html">Login</a>
            <a href="artigos.html">Artigos</a>
            <li><a href="#" onclick="window.open('https://wa.me/5511930770585', '_blank'); return false;">Suporte</a></li>
        </nav>
    </header>

    <!-- CAIXA DO MEIO -->
    <main class="main-container">
        <div class="card-form">
            
            <h1>Criar Conta</h1>
            <p class="subtitle">Insira os seus dados</p>

            <!-- Formulário -->
            <form onsubmit="mostrarMensagem(event)">
                
                <div class="section-box">
                    <h3>Dados</h3>

                    <!-- Campo Nome -->
                    <div class="input-group">
                        <label>Nome</label>
                        <input type="text" id="campoNome" placeholder="O seu nome" required>
                    </div>

                    <!-- Campo E-mail -->
                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" placeholder="O seu email" required>
                    </div>

                    <!-- Campo CPF -->
                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text" placeholder="000.000.000-00" required>
                    </div>

                    <!-- Campo Telefone -->
                    <div class="input-group">
                        <label>Telefone / Telemóvel</label>
                        <input type="tel" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <!-- Botão principal de Criar -->
                <button type="submit" class="btn-submit">Criar</button>

                <!-- Botão secundário para quem já tem conta -->
                <a href="login.html" class="btn-secondary">Entre no A.S.A.I.</a>
            </form>

        </div>
    </main>

    <!-- Liga ao ficheiro de JavaScript -->
    <script src="script.js"></script>

</body>
</html>
