<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu login - A.S.A.I.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/login.css">
    <link rel="icon" type="image/png" href="./fotos/pecas.png">
</head>
<body>

    <div class="login-container">
        <div class="login-left">
            <h2>FAÇA SEU LOGIN</h2>
            
            <form id="form-login-cliente">
                <div class="input-group">
                    <label for="email">E-MAIL</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="recsenha.html" class="forgot-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-entrar">ENTRAR</button>
            </form>

            <p class="signup-text">
                Não tem conta ainda? <a href="criar.html">Crie agora</a>
            </p>
        </div>

        <div class="login-right">
            <img src="./fotos/logo.png" alt="A.S.A.I. Manutenções" class="banner-img">
        </div>
    </div>
    
    <script>
        document.getElementById('form-login-cliente').onsubmit = async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch('/api/site/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await res.json();

                if (!res.ok) {
                    alert(dados.erro || 'E-mail ou senha inválidos.');
                    return;
                }

                // Guarda os dados do cliente logado na tabela reservada
                localStorage.setItem('clienteSite', JSON.stringify(dados.cliente));

                // Redireciona para a página de registrar a ordem de serviço
                window.location.href = 'cadastro.html';
            } catch (err) {
                alert('Erro ao conectar com o servidor. Verifique se o servidor está rodando na porta 3000.');
            }
        };
    </script>

</body>
</html>
