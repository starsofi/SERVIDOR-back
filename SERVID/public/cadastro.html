<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Ordem de Serviço - ASAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <link rel="icon" type="image/png" href="./fotos/pecas.png">
</head>
<body>

    <div class="pagina-formulario">
        
        <header class="cabecalho-novo">
            <div class="bloco-logo">
                <div class="logo-wrapper">
                    <img src="./fotos/pecas.png" alt="Logótipo ASAI" class="logo-img">
                </div>
                <div class="texto-logo">
                    <h1 class="logo-titulo">A.S.A.I.</h1>
                    <p class="logo-subtitulo">MANUTENÇÕES</p>
                </div>
            </div>
            <div class="bloco-titulo">
                <span class="tag-os">ÁREA DO CLIENTE</span>
                <h2 class="titulo-destaque">Registrar Ordem de Serviço</h2>
            </div>
        </header>

        <form id="form-os" class="corpo-formulario">

            <div class="secao-container">
                <div class="pilula-secao">1. Seus Dados</div>

                <div class="linha-campo">
                    <div class="campo flex-1">
                        <label for="cli-nome">Nome Completo:</label>
                        <input type="text" id="cli-nome" required>
                    </div>
                    <div class="campo flex-1">
                        <label for="cli-email">E-mail:</label>
                        <input type="email" id="cli-email" required>
                    </div>
                    <div class="campo flex-1">
                        <label for="cli-telefone">Telefone / WhatsApp:</label>
                        <input type="text" id="cli-telefone" required>
                    </div>
                </div>
            </div>

            <div class="secao-container">
                <div class="pilula-secao">2. Detalhes do Equipamento</div>

                <div class="linha-campo">
                    <div class="campo flex-1">
                        <label for="equipamento">Equipamento:</label>
                        <input type="text" id="equipamento" placeholder="Ex: Notebook, Impressora, PC" required>
                    </div>
                    <div class="campo flex-1">
                        <label for="modelo">Marca e Modelo:</label>
                        <input type="text" id="modelo" placeholder="Ex: Dell Vostro / HP LaserJet 1020" required>
                    </div>
                </div>
            </div>

            <div class="secao-container">
                <div class="pilula-secao">3. Detalhamento do Defeito</div>

                <div class="campo">
                    <label for="descricao-defeito">Descrição do Problema / Defeito:</label>
                    <textarea id="descricao-defeito" placeholder="Descreva em detalhes o que está acontecendo com o equipamento..." required></textarea>
                </div>
            </div>

            <div class="container-btn-submit" style="display: flex; gap: 15px; justify-content: flex-end;">
                <a href="../index.html" class="btn-acao" style="text-decoration: none; display: inline-flex; align-items: center;">Voltar</a>
                <button type="submit" class="btn-submeter">Enviar Ordem de Serviço</button>
            </div>

        </form>

        <footer class="rodape-faixa"></footer>

    </div>

    <script>
        const clienteSalvo = JSON.parse(localStorage.getItem('clienteSite') || 'null');

        if (clienteSalvo) {
            document.getElementById('cli-nome').value = clienteSalvo.nome || '';
            document.getElementById('cli-email').value = clienteSalvo.email || '';
            document.getElementById('cli-telefone').value = clienteSalvo.telefone || '';
        }

        document.getElementById('form-os').onsubmit = async (e) => {
            e.preventDefault();

            const dados = {
                nome: document.getElementById('cli-nome').value,
                email: document.getElementById('cli-email').value,
                telefone: document.getElementById('cli-telefone').value,
                equipamento: document.getElementById('equipamento').value,
                modelo: document.getElementById('modelo').value,
                problema: document.getElementById('descricao-defeito').value
            };

            try {
                const res = await fetch('/api/site/registrar-pedido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resposta = await res.json();

                if (!res.ok) {
                    alert(resposta.erro || 'Erro ao enviar solicitação.');
                    return;
                }

                alert('Ordem de Serviço registrada com sucesso!\nO número do seu protocolo é: #' + resposta.protocolo);
                window.location.href = '../index.html'; 
            } catch (err) {
                alert('Erro ao conectar com o servidor.');
            }
        };
    </script>

</body>
</html>
